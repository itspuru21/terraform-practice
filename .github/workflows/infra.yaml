name: terraform infra deploy
on:
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the OIDC JWT token
  contents: read  # Required for actions/checkout

jobs: 
  plan:
    runs-on: ubuntu-latest
    environment: plan # Maps to your GitHub Environment
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1 # Adjust to your region

      - name: Terraform Init
        run: terraform init -input=false
          
      - name: Terraform Plan
        run: terraform plan -input=false -out infra.plan

      - name: upload the plan as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan
          path: infra.plan

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: apply # Triggers the manual approval gate
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1 # Adjust to your region

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tf-plan
          
      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve infra.plan